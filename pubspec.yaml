name: maxai

description: MAX AI - Personal Assistant by The Tron Forge Limited

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.2.3
  http: ^1.2.0
  supabase_flutter: ^2.9.1
  google_sign_in: ^7.2.0
  permission_handler: ^11.3.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  video_player: ^2.8.6
  image_picker: ^1.0.7
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0
  file_picker: ^8.0.0
  flutter_link_previewer: ^3.2.2
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.5
  device_info_plus: ^11.1.1
  record: ^5.1.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - lib/models/
